server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 非默认端口（如 8082）公网访问时，禁止 nginx 发出携带完整主机名的绝对重定向
    # （301 Location 会丢失端口导致浏览器跳错地址，页面空白）
    absolute_redirect off;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Next.js 静态资源：内容寻址（带 hash），可长缓存
    location /_next/static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反代到后端容器（同源，规避跨域）
    # 大模型任务耗时较长，超时放宽到 300s
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }

    # OCR 之外的简历解析端点也走后端（如有直接路径调用）
    location /ai/ {
        proxy_pass http://backend:8000/ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }

    # 静态页面：先找文件，再找 .html 后缀文件，最后回退首页
    # （去掉 $uri/ 目录回退，避免目录重定向 301；根 index.html 为客户端跳转组件，
    #  会重定向到 /zh/dashboard）
    location / {
        try_files $uri $uri.html /index.html;
    }
}